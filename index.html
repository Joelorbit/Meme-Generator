<html lang="en" data-theme="default" data-mode="dark">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta name="description" content="The fastest way to slap text on cursed images, cook dual-panel brainrot, and farm internet points. 100% free, client-side privacy, 0ms lag canvas." />
    <meta name="keywords" content="meme generator, meme maker, memes, blank meme templates, fabric.js, svelte 5, dual panel meme" />
    <meta name="author" content="Joelorbit" />

    <!-- OpenGraph / Social Meta Tags -->
    <meta property="og:title" content="MemeStudio — High-Velocity Meme Forge" />
    <meta property="og:description" content="The fastest way to slap text on cursed images, cook dual-panel brainrot, and farm internet points. 100% free, client-side privacy, 0ms lag." />

    <meta property="og:image" content="/logo.svg" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="MemeStudio — High-Velocity Meme Forge" />

    <!-- Google Fonts: Outfit & Lexend -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Lexend:wght@300..800&family=Montserrat:wght@600..900&family=Outfit:wght@300..900&family=JetBrains+Mono:wght@400..700&display=swap"
      rel="stylesheet"
    />

    <!-- Theme Initializer Script -->
    <script>
      (() => {
        try {
          const savedMode = localStorage.getItem('memestudio-mode') || localStorage.getItem('eyu-mode');
          const systemMode = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          const mode = savedMode === 'light' || savedMode === 'dark' ? savedMode : systemMode;
          document.documentElement.dataset.theme = 'default';
          document.documentElement.dataset.mode = mode;
          document.documentElement.style.colorScheme = mode;
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="/src/lib/tokens.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
